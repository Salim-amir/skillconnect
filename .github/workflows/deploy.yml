name: Deploy SkillConnect to AWS EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /var/www/skillconnect
            git checkout develop
            git pull origin develop

            # Pastikan konfigurasi Midtrans terpasang di .env server jika belum ada
            if ! grep -q "MIDTRANS_SERVER_KEY" .env; then
              echo "" >> .env
              echo "# MIDTRANS PAYMENT GATEWAY CONFIG" >> .env
              echo "MIDTRANS_SERVER_KEY=SB-Mid-server-XUkiJWrHJE0C8MVhZogtf64q" >> .env
              echo "MIDTRANS_CLIENT_KEY=SB-Mid-client-CM2_EtJZ1DUCdxfpumFOm-W0" >> .env
              echo "MIDTRANS_IS_PRODUCTION=false" >> .env
              echo "MIDTRANS_IS_SANITIZED=true" >> .env
              echo "MIDTRANS_IS_3DS=true" >> .env
            fi

            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            echo "🚀 Deployment successfully completed to https://skillconnect.web.id!"

